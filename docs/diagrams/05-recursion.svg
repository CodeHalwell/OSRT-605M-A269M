<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 720" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lbl{font-size:13px;fill:#0f172a;font-weight:600}
      .sub{font-size:10.5px;fill:#475569}
      .ttl{font-size:20px;font-weight:700;fill:#0f172a}
      .e{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arr)}
      .b0{fill:#dbeafe;stroke:#2563eb}
      .b1{fill:#fef3c7;stroke:#d97706}
      .b2{fill:#ede9fe;stroke:#7c3aed}
      .io{fill:#e2e8f0;stroke:#64748b}
      .bx{font-size:11px;font-weight:600;fill:#0f172a}
      .eff{font-size:9px;fill:#64748b}
    </style>
  </defs>

  <text x="30" y="36" class="ttl">Recursion — 3 physical blocks × 6 loops = 18 effective layers</text>
  <text x="30" y="56" class="sub">weight-shared depth: the same 3 blocks are re-applied 6 times; loop index L = loop·3 + block</text>

  <!-- physical blocks legend (left) -->
  <rect x="30" y="92" width="150" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="105" y="112" text-anchor="middle" class="sub" font-weight="700" fill="#0f172a">3 physical blocks</text>
  <text x="105" y="126" text-anchor="middle" class="eff">(the only weights)</text>
  <rect class="b0" x="48" y="138" width="114" height="28" rx="6" stroke-width="1.5"/><text x="105" y="157" text-anchor="middle" class="bx">Block 0</text>
  <rect class="b1" x="48" y="174" width="114" height="28" rx="6" stroke-width="1.5"/><text x="105" y="193" text-anchor="middle" class="bx">Block 1</text>
  <rect class="b2" x="48" y="210" width="114" height="28" rx="6" stroke-width="1.5"/><text x="105" y="229" text-anchor="middle" class="bx">Block 2</text>
  <text x="105" y="262" text-anchor="middle" class="eff">reused 6× →</text>

  <!-- embedding -->
  <rect class="io" x="300" y="92" width="280" height="34" rx="9" stroke-width="1.6"/>
  <text x="440" y="114" text-anchor="middle" class="lbl">token embedding (65,536 × 1536)</text>
  <line class="e" x1="440" y1="126" x2="440" y2="146"/>

  <!-- 6 loop rows -->
  <!-- macro to place: each row y -->
  <!-- loop 0 -->
  <g>
    <text x="296" y="166" text-anchor="end" class="sub">loop 0</text>
    <rect class="b0" x="306" y="148" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="164" text-anchor="middle" class="bx">B0</text><text x="348" y="175" text-anchor="middle" class="eff">L0</text>
    <rect class="b1" x="398" y="148" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="164" text-anchor="middle" class="bx">B1</text><text x="440" y="175" text-anchor="middle" class="eff">L1</text>
    <rect class="b2" x="490" y="148" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="164" text-anchor="middle" class="bx">B2</text><text x="532" y="175" text-anchor="middle" class="eff">L2</text>
  </g>
  <line class="e" x1="440" y1="178" x2="440" y2="194"/>
  <!-- loop 1 -->
  <g>
    <text x="296" y="214" text-anchor="end" class="sub">loop 1</text>
    <rect class="b0" x="306" y="196" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="212" text-anchor="middle" class="bx">B0</text><text x="348" y="223" text-anchor="middle" class="eff">L3</text>
    <rect class="b1" x="398" y="196" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="212" text-anchor="middle" class="bx">B1</text><text x="440" y="223" text-anchor="middle" class="eff">L4</text>
    <rect class="b2" x="490" y="196" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="212" text-anchor="middle" class="bx">B2</text><text x="532" y="223" text-anchor="middle" class="eff">L5</text>
  </g>
  <line class="e" x1="440" y1="226" x2="440" y2="242"/>
  <!-- loop 2 -->
  <g>
    <text x="296" y="262" text-anchor="end" class="sub">loop 2</text>
    <rect class="b0" x="306" y="244" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="260" text-anchor="middle" class="bx">B0</text><text x="348" y="271" text-anchor="middle" class="eff">L6</text>
    <rect class="b1" x="398" y="244" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="260" text-anchor="middle" class="bx">B1</text><text x="440" y="271" text-anchor="middle" class="eff">L7</text>
    <rect class="b2" x="490" y="244" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="260" text-anchor="middle" class="bx">B2</text><text x="532" y="271" text-anchor="middle" class="eff">L8</text>
  </g>
  <line class="e" x1="440" y1="274" x2="440" y2="290"/>
  <!-- loop 3 -->
  <g>
    <text x="296" y="310" text-anchor="end" class="sub">loop 3</text>
    <rect class="b0" x="306" y="292" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="308" text-anchor="middle" class="bx">B0</text><text x="348" y="319" text-anchor="middle" class="eff">L9</text>
    <rect class="b1" x="398" y="292" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="308" text-anchor="middle" class="bx">B1</text><text x="440" y="319" text-anchor="middle" class="eff">L10</text>
    <rect class="b2" x="490" y="292" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="308" text-anchor="middle" class="bx">B2</text><text x="532" y="319" text-anchor="middle" class="eff">L11</text>
  </g>
  <line class="e" x1="440" y1="322" x2="440" y2="338"/>
  <!-- loop 4 -->
  <g>
    <text x="296" y="358" text-anchor="end" class="sub">loop 4</text>
    <rect class="b0" x="306" y="340" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="356" text-anchor="middle" class="bx">B0</text><text x="348" y="367" text-anchor="middle" class="eff">L12</text>
    <rect class="b1" x="398" y="340" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="356" text-anchor="middle" class="bx">B1</text><text x="440" y="367" text-anchor="middle" class="eff">L13</text>
    <rect class="b2" x="490" y="340" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="356" text-anchor="middle" class="bx">B2</text><text x="532" y="367" text-anchor="middle" class="eff">L14</text>
  </g>
  <line class="e" x1="440" y1="370" x2="440" y2="386"/>
  <!-- loop 5 -->
  <g>
    <text x="296" y="406" text-anchor="end" class="sub">loop 5</text>
    <rect class="b0" x="306" y="388" width="84" height="30" rx="6" stroke-width="1.4"/><text x="348" y="404" text-anchor="middle" class="bx">B0</text><text x="348" y="415" text-anchor="middle" class="eff">L15</text>
    <rect class="b1" x="398" y="388" width="84" height="30" rx="6" stroke-width="1.4"/><text x="440" y="404" text-anchor="middle" class="bx">B1</text><text x="440" y="415" text-anchor="middle" class="eff">L16</text>
    <rect class="b2" x="490" y="388" width="84" height="30" rx="6" stroke-width="1.4"/><text x="532" y="404" text-anchor="middle" class="bx">B2</text><text x="532" y="415" text-anchor="middle" class="eff">L17</text>
  </g>
  <line class="e" x1="440" y1="418" x2="440" y2="436"/>

  <!-- reuse arrows from physical blocks -->
  <path d="M162,150 C230,150 240,162 300,162" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" opacity="0.6"/>
  <path d="M162,188 C230,300 240,400 300,403" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" opacity="0.45"/>

  <!-- norm + collapse + heads -->
  <rect class="io" x="300" y="436" width="280" height="34" rx="9" stroke-width="1.6"/>
  <text x="440" y="458" text-anchor="middle" class="lbl">mHC collapse → RMSNorm (norm_out)</text>
  <line class="e" x1="440" y1="470" x2="440" y2="486"/>
  <rect x="300" y="486" width="280" height="34" rx="9" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.6"/>
  <text x="440" y="508" text-anchor="middle" class="lbl">tied LM head  (+ 2 MTP heads, train)</text>

  <!-- note -->
  <rect x="30" y="548" width="550" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="45" y="570" class="sub" font-weight="700" fill="#0f172a">Effective depth without the parameters.</text>
  <text x="45" y="590" class="sub">18 transformer applications, but only 3 blocks' worth of weights — the recursion buys depth</text>
  <text x="45" y="606" class="sub">cheaply. Each effective layer L also carries its own HRA adapter (18 adapters) and a loop</text>
  <text x="45" y="622" class="sub">embedding, so the shared blocks can still specialise per iteration.</text>
  <text x="45" y="646" class="sub" fill="#7c3aed">Collapse telemetry tracks ‖Δx‖/‖x‖ at each of the 18 layers to catch loops degenerating to no-ops.</text>
</svg>
