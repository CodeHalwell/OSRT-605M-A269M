<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lbl{font-size:13.5px;fill:#0f172a;font-weight:600}
      .sub{font-size:10.5px;fill:#475569}
      .ttl{font-size:20px;font-weight:700;fill:#0f172a}
      .e{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arr)}
      .attn{fill:#dbeafe;stroke:#2563eb}
      .moe{fill:#fef3c7;stroke:#d97706}
      .mhc{fill:#ede9fe;stroke:#7c3aed}
      .io{fill:#e2e8f0;stroke:#64748b}
    </style>
  </defs>

  <text x="30" y="38" class="ttl">RecursiveBlock  (one of 3 physical blocks)</text>
  <text x="30" y="60" class="sub">attention sub-block + MoE sub-block, each mixed into the residual via mHC · conditioned on loop index</text>

  <!-- block container -->
  <rect x="150" y="120" width="340" height="380" rx="14" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- input streams -->
  <rect class="io" x="200" y="80" width="240" height="36" rx="9" stroke-width="1.6"/>
  <text x="320" y="103" text-anchor="middle" class="lbl">4 residual streams in</text>
  <line class="e" x1="320" y1="116" x2="320" y2="146"/>

  <!-- loop embedding -->
  <rect class="io" x="40" y="146" width="96" height="50" rx="9" stroke-width="1.6"/>
  <text x="88" y="167" text-anchor="middle" class="sub">loop_emb</text>
  <text x="88" y="182" text-anchor="middle" class="sub">[loop_idx]</text>
  <line class="e" x1="136" y1="171" x2="178" y2="178"/>

  <!-- attention sub-block -->
  <rect class="attn" x="180" y="146" width="280" height="64" rx="9" stroke-width="1.6"/>
  <text x="320" y="170" text-anchor="middle" class="lbl">Attention  (GQA, V-from-K, flash)</text>
  <text x="320" y="188" text-anchor="middle" class="sub">+ HRA adapter (rank 256, per effective layer)</text>
  <text x="320" y="202" text-anchor="middle" class="sub">→ see diagram 01</text>
  <line class="e" x1="320" y1="210" x2="320" y2="236"/>

  <!-- mHC attn -->
  <rect class="mhc" x="210" y="236" width="220" height="40" rx="9" stroke-width="1.6"/>
  <text x="320" y="261" text-anchor="middle" class="lbl">mHC.update  (mix into streams)</text>
  <line class="e" x1="320" y1="276" x2="320" y2="312"/>

  <!-- MoE sub-block -->
  <rect class="moe" x="180" y="312" width="280" height="56" rx="9" stroke-width="1.6"/>
  <text x="320" y="336" text-anchor="middle" class="lbl">MoE  (1 shared + 8 routed, top-2)</text>
  <text x="320" y="354" text-anchor="middle" class="sub">grouped-GEMM dispatch → see diagram 02</text>
  <line class="e" x1="320" y1="368" x2="320" y2="394"/>

  <!-- mHC ffn -->
  <rect class="mhc" x="210" y="394" width="220" height="40" rx="9" stroke-width="1.6"/>
  <text x="320" y="419" text-anchor="middle" class="lbl">mHC.update  (mix into streams)</text>
  <line class="e" x1="320" y1="434" x2="320" y2="470"/>

  <!-- output -->
  <rect class="io" x="200" y="470" width="240" height="36" rx="9" stroke-width="1.6"/>
  <text x="320" y="493" text-anchor="middle" class="lbl">4 residual streams out</text>

  <!-- note -->
  <rect x="30" y="528" width="580" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="45" y="550" class="sub" font-weight="700" fill="#0f172a">Same weights, reused 6× (diagram 05).</text>
  <text x="45" y="570" class="sub">The loop embedding is the only thing that differs across the 6 applications,</text>
  <text x="45" y="586" class="sub">letting one block specialise its behaviour per recursive iteration.</text>
</svg>
