<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .lbl{font-size:13.5px;fill:#0f172a;font-weight:600}
      .sub{font-size:10.5px;fill:#475569}
      .ttl{font-size:20px;font-weight:700;fill:#0f172a}
      .note{font-size:11px;fill:#334155}
      .e{fill:none;stroke:#475569;stroke-width:1.6;marker-end:url(#arr)}
      .mhc{fill:#ede9fe;stroke:#7c3aed}
      .sub-b{fill:#dbeafe;stroke:#2563eb}
      .sink{fill:#f5d0fe;stroke:#a21caf}
      .stream{stroke:#7c3aed;stroke-width:2;fill:none}
    </style>
  </defs>

  <text x="30" y="38" class="ttl">Manifold-Constrained Hyper-Connections (mHC)</text>
  <text x="30" y="60" class="sub">replaces x = x + f(x) with n_hc=4 residual streams + Sinkhorn-normalized (doubly-stochastic) mixing — keeps the residual bounded across 18 recursive layers</text>

  <!-- 4 residual streams in -->
  <text x="40" y="120" class="lbl" fill="#7c3aed">4 residual streams (B,S,4,1536)</text>
  <line class="stream" x1="40" y1="140" x2="300" y2="140"/>
  <line class="stream" x1="40" y1="165" x2="300" y2="165"/>
  <line class="stream" x1="40" y1="190" x2="300" y2="190"/>
  <line class="stream" x1="40" y1="215" x2="300" y2="215"/>

  <!-- B matrix: combine streams -> sublayer input -->
  <rect class="mhc" x="300" y="135" width="140" height="86" rx="9" stroke-width="1.6"/>
  <text x="370" y="170" text-anchor="middle" class="lbl">B mix</text>
  <text x="370" y="187" text-anchor="middle" class="sub">streams → 1</text>
  <text x="370" y="202" text-anchor="middle" class="sub">(width connect)</text>
  <line class="e" x1="440" y1="178" x2="490" y2="178"/>

  <!-- sublayer f -->
  <rect class="sub-b" x="490" y="150" width="200" height="56" rx="9" stroke-width="1.6"/>
  <text x="590" y="172" text-anchor="middle" class="lbl">sub-layer  f(·)</text>
  <text x="590" y="190" text-anchor="middle" class="sub">attention  OR  MoE</text>
  <line class="e" x1="690" y1="178" x2="740" y2="178"/>

  <!-- C matrix: distribute back -->
  <rect class="mhc" x="740" y="135" width="120" height="86" rx="9" stroke-width="1.6"/>
  <text x="800" y="170" text-anchor="middle" class="lbl">C mix</text>
  <text x="800" y="187" text-anchor="middle" class="sub">f + streams</text>
  <text x="800" y="202" text-anchor="middle" class="sub">→ 4 streams</text>

  <!-- streams out (curve back down) -->
  <path class="e" d="M800,221 C800,270 120,250 60,290"/>
  <text x="40" y="312" class="lbl" fill="#7c3aed">updated 4 streams →  (next sub-layer / next loop)</text>
  <line class="stream" x1="40" y1="330" x2="640" y2="330"/>
  <line class="stream" x1="40" y1="352" x2="640" y2="352"/>
  <line class="stream" x1="40" y1="374" x2="640" y2="374"/>
  <line class="stream" x1="40" y1="396" x2="640" y2="396"/>

  <!-- Sinkhorn box feeding B and C -->
  <rect class="sink" x="300" y="430" width="280" height="92" rx="9" stroke-width="1.6"/>
  <text x="440" y="456" text-anchor="middle" class="lbl" fill="#86198f">log-domain Sinkhorn (20 iters)</text>
  <text x="440" y="476" text-anchor="middle" class="sub">normalises B, C → doubly-stochastic</text>
  <text x="440" y="492" text-anchor="middle" class="sub">(rows &amp; cols sum to 1 → Birkhoff polytope)</text>
  <text x="440" y="510" text-anchor="middle" class="sub">mixing lives on a manifold → no residual blow-up</text>
  <line x1="370" y1="430" x2="370" y2="221" class="e" stroke="#7c3aed" marker-end="url(#arrp)" stroke-dasharray="4 3"/>
  <line x1="510" y1="430" x2="780" y2="221" class="e" stroke="#7c3aed" marker-end="url(#arrp)" stroke-dasharray="4 3"/>

  <!-- collapse head -->
  <rect class="mhc" x="660" y="330" width="200" height="66" rx="9" stroke-width="1.6"/>
  <text x="760" y="356" text-anchor="middle" class="lbl">mhc_collapse</text>
  <text x="760" y="374" text-anchor="middle" class="sub">learned 4→1 weights (init 1/4)</text>
  <text x="760" y="388" text-anchor="middle" class="sub">→ d_model for LM head / aux</text>
  <line class="e" x1="640" y1="363" x2="660" y2="363"/>

  <!-- evidence note -->
  <rect x="30" y="540" width="820" height="78" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="45" y="562" class="note" font-weight="700">Observed at runtime (W&amp;B loop/hidden_norm):</text>
  <text x="45" y="582" class="note">the residual-stream norm oscillates in a bounded band (~10k–14.6k) and resets to a consistent value at the start of every recursive loop —</text>
  <text x="45" y="600" class="note">confirming the Sinkhorn-constrained mixing keeps the 18-effective-layer recursion stable (no blow-up, no decay).</text>
</svg>
